[build]
  command = "pnpm generate"
  publish = "dist"

[functions]
  directory = "netlify/functions"
[identity]
  provider = "netlify"


[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/:splat"
  status = 200
  force = true

# SPA fallback: serve index.html for all unmatched paths so the
# client-side router can handle them (e.g. /admin/login, /gallery, etc.)
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
